- defaults:
    link:
      relink: true

- clean: ['$HOME/.config']

- link:
    "$HOME/.config/nvim": nvim
    "$HOME/.config/nvim_up": nvim/UP
    "$HOME/.config/gitui": gitui 
    "$HOME/.config/zellij": zellij
    "$HOME/.config/alacritty/alacritty.toml": alacritty/alacritty.toml
    "$HOME/.cargo/bin/vup": neovide/vup
    "$HOME/.zshrc":
      path: zsh/zshrc
      force: true
